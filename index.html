<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글꾸미기 에디터</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&display=swap');
@font-face{font-family:'Ridibatang';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff') format('woff');font-weight:normal;font-display:swap}
@font-face{font-family:'GangwonEduModu';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEdu_OTFLightA.woff') format('woff');font-weight:300;font-display:swap}
@font-face{font-family:'GangwonEduModu';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEdu_OTFBoldA.woff') format('woff');font-weight:700;font-display:swap}
@font-face{font-family:'OngleipParkDahyeon';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2411-3@1.0/Ownglyph_ParkDaHyun.woff2') format('woff2');font-weight:normal;font-display:swap}
:root{
  --bg-page:#f4f3ee; --bg-panel:#faf9f5; --bg-elem:#ffffff; --bg-hover:#eceae2;
  --text:#1c1c1a; --text-2:#5f5e5a; --text-3:#9a988f;
  --border:#dcdad2; --border-2:#c4c2b8;
  --accent:#378ADD; --accent-bg:#e8f1fb; --accent-text:#0c447c;
  --danger:#A32D2D; --danger-bg:#fcebeb;
  --radius:8px; --radius-lg:12px;
}
.dark{
  --bg-page:#1a1a18; --bg-panel:#222220; --bg-elem:#2a2a28; --bg-hover:#34332f;
  --text:#ededea; --text-2:#a8a69e; --text-3:#74726b;
  --border:#3a3935; --border-2:#4d4c46;
  --accent:#5da0e8; --accent-bg:#1e3247; --accent-text:#b5d4f4;
  --danger:#e08585; --danger-bg:#3a2020;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:13px;color:var(--text);background:var(--bg-page)}
svg.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;flex-shrink:0}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg-panel);border-bottom:0.5px solid var(--border)}
.topbar h1{font-size:16px;font-weight:600;display:flex;align-items:center;gap:7px}
.topbar h1 svg.ic{width:18px;height:18px;stroke:var(--accent)}
.topbar .spacer{flex:1}
.app{display:grid;grid-template-columns:220px 1fr 280px;height:calc(100vh - 49px)}
.panel{overflow:hidden;display:flex;flex-direction:column;min-height:0}
.panel-scroll{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
.left{background:var(--bg-panel);border-right:0.5px solid var(--border)}
.right{background:var(--bg-panel);border-left:0.5px solid var(--border)}
.right .panel-scroll{padding:0}
.center{background:var(--bg-page);min-width:0}
.toolbar{display:flex;gap:6px;padding:8px 12px;border-bottom:0.5px solid var(--border);background:var(--bg-panel);align-items:center;flex-wrap:wrap}
.tlabel{font-size:11px;color:var(--text-3)}
.canvas-outer{flex:1;overflow:auto;padding:16px;min-height:0}
.sec-title{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
button{font-family:inherit;font-size:12px;padding:5px 8px;border:0.5px solid var(--border-2);border-radius:6px;background:var(--bg-elem);color:var(--text);cursor:pointer;transition:background .1s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;justify-content:center}
button:hover{background:var(--bg-hover)}
button:disabled{opacity:.4;cursor:not-allowed}
button.danger{border-color:var(--danger);color:var(--danger)}
button.danger:hover{background:var(--danger-bg)}
button.accent{border-color:var(--accent);color:var(--accent-text)}
button.mini{font-size:10px;padding:3px 6px;gap:3px}
button.on{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent)}
button.icon{padding:5px;width:30px;height:30px}
.hint{font-size:10px;color:var(--text-3);line-height:1.5;margin-top:4px}
.divider{border:none;border-top:0.5px solid var(--border)}
.row{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.row .lab{font-size:11px;color:var(--text-2);width:56px;flex-shrink:0}
input[type=color]{width:28px;height:24px;border:0.5px solid var(--border-2);border-radius:4px;padding:1px;cursor:pointer;background:none;flex-shrink:0}
input[type=color]:disabled{opacity:.3}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.num{width:44px;font-size:11px;padding:3px 5px;border:0.5px solid var(--border-2);border-radius:4px;background:var(--bg-elem);color:var(--text);text-align:right;flex-shrink:0}
.hex{width:72px;font-size:10px;font-family:ui-monospace,monospace;padding:3px 5px;border:0.5px solid var(--border-2);border-radius:4px;background:var(--bg-elem);color:var(--text);flex-shrink:0}
input[type=text],select,textarea{font-size:11px;padding:4px 6px;border:0.5px solid var(--border-2);border-radius:4px;background:var(--bg-elem);color:var(--text);font-family:inherit}
.row input[type=text]:not(.num):not(.hex),.row select,.row textarea{flex:1;min-width:0}
.no-sel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:36px 12px;color:var(--text-3);text-align:center}
textarea.out{width:100%;min-height:80px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;padding:6px;border:0.5px solid var(--border-2);border-radius:6px;resize:vertical;background:var(--bg-elem);color:var(--text)}
.tree-node{font-size:11px;cursor:pointer;border-radius:4px;padding:3px 5px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-node:hover{background:var(--bg-hover)}
.tree-node.sel{background:var(--accent-bg);color:var(--accent-text)}
.tree-node svg.ic{width:13px;height:13px}
.canvas-root{min-height:480px;border:1.5px dashed var(--border-2);border-radius:8px;padding:12px;background:var(--bg-elem)}
.canvas-root.dark-preview{background:#1a1a18}
.rwrap{position:relative}
.rwrap.sel-outline>.rbox{outline:2px solid var(--accent);outline-offset:1px}
.rhandle{position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:9px;height:34px;background:var(--accent);border-radius:3px;cursor:ew-resize;z-index:20;opacity:0}
.rwrap.sel-outline>.rhandle{opacity:1}
.rhandle-h{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:34px;height:9px;background:#1D9E75;border-radius:3px;cursor:ns-resize;z-index:20;opacity:0}
.rwrap.sel-outline>.rhandle-h{opacity:1}
.side-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;flex:1}
.side-grid button{padding:3px 2px;font-size:10px}
.side-row{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.side-row button{padding:3px 2px;font-size:10px}
.recent-row{display:flex;gap:4px;flex-wrap:wrap;margin:-2px 0 8px 63px}
.swatch{width:18px;height:18px;border-radius:4px;border:0.5px solid var(--border-2);cursor:pointer;padding:0}
.color-trigger{width:28px;height:24px;border-radius:4px;border:0.5px solid var(--border-2);cursor:pointer;flex-shrink:0;background-clip:padding-box}
.color-pop{position:fixed;z-index:200;background:var(--bg-elem);border:0.5px solid var(--border-2);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px;width:202px}
.color-pop .pop-title{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin:0 0 5px}
.color-pop .pop-title:not(:first-child){margin-top:10px}
.sw-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.sw{width:100%;aspect-ratio:1;border-radius:4px;border:0.5px solid rgba(128,128,128,.25);cursor:pointer;padding:0}
.sw.empty{background:transparent;border-style:dashed;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:11px}
.pop-custom{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:8px;border-top:0.5px solid var(--border)}
.pop-custom input[type=color]{width:30px;height:26px}
.pop-backdrop{position:fixed;inset:0;z-index:199}
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.theme-cell{cursor:pointer;border-radius:6px;padding:5px 3px;text-align:center;border:0.5px solid var(--border)}
.theme-cell:hover{background:var(--bg-hover)}
.theme-dots{display:flex;gap:2px;justify-content:center;margin-bottom:3px}
.theme-dot{width:11px;height:11px;border-radius:3px;border:0.5px solid rgba(128,128,128,.3)}
.theme-cell span{font-size:10px;color:var(--text-2)}
.sel-header{background:var(--bg-panel);padding:10px 12px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.sel-header .name{font-weight:500;font-size:13px;display:flex;align-items:center;gap:6px}
.core-block{padding:12px;border-bottom:0.5px solid var(--border)}
.tabs{display:flex;border-bottom:0.5px solid var(--border);position:sticky;top:0;background:var(--bg-panel);z-index:4}
.tab{flex:1;text-align:center;padding:9px 0;font-size:12px;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px}
.tab.active{color:var(--accent-text);border-bottom-color:var(--accent);font-weight:500}
.tab-body{padding:12px}
.save-status{font-size:10px;color:var(--text-3)}
.mobile-tabs{display:none}
.subsec{margin-top:12px}
.subsec:first-child{margin-top:0}
@media(max-width:860px){
  .app{grid-template-columns:1fr;height:auto}
  .panel{height:auto}
  .left,.right{border:none;border-bottom:0.5px solid var(--border)}
  .center{order:-1}
  .canvas-outer{padding:10px}
  .mobile-tabs{display:flex;gap:5px;padding:8px 12px;background:var(--bg-panel);border-bottom:0.5px solid var(--border);position:sticky;top:0;z-index:30}
  .mobile-tabs button{flex:1}
}
</style>
</head>
<body>

<div class="topbar">
  <h1><svg class="ic" viewBox="0 0 24 24"><path d="M3 21l3-1 11-11-2-2L4 18l-1 3z"/><path d="M14.5 5.5l4 4"/></svg> 글꾸미기 에디터</h1>
  <button onclick="undo()" id="undo-btn" class="mini" disabled><svg class="ic" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg> 실행취소</button>
  <button onclick="redo()" id="redo-btn" class="mini" disabled><svg class="ic" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h1"/></svg> 다시실행</button>
  <span class="save-status" id="save-status">새 창마다 초기화됩니다 · 보관하려면 "작업 저장"</span>
  <span class="spacer"></span>
  <button onclick="resetAll()" id="reset-btn" class="mini" title="모든 작업과 저장 데이터 삭제"><svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg> 초기화</button>
  <button onclick="toggleDark()" id="dark-btn" class="mini"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg> 다크</button>
</div>

<div class="mobile-tabs">
  <button onclick="mobileTab('left')" id="mt-left" class="on">요소</button>
  <button onclick="mobileTab('center')" id="mt-center">미리보기</button>
  <button onclick="mobileTab('right')" id="mt-right">속성</button>
</div>

<div class="app">
  <div class="panel left" id="panel-left">
    <div class="panel-scroll">
      <div>
        <div class="sec-title">요소 추가</div>
        <div class="btn-grid" id="add-buttons"></div>
      </div>
      <hr class="divider">
      <div>
        <div class="sec-title">템플릿</div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <button class="mini" onclick="loadTemplate('notice')">공지 박스</button>
          <button class="mini" onclick="loadTemplate('card')">프로필 카드</button>
          <button class="mini" onclick="loadTemplate('quote')">인용 카드</button>
          <button class="mini" onclick="loadTemplate('two')">2단 레이아웃</button>
        </div>
      </div>
      <hr class="divider">
      <div>
        <div class="sec-title">구조</div>
        <div id="tree"></div>
      </div>
    </div>
  </div>

  <div class="panel center" id="panel-center">
    <div class="toolbar">
      <span class="tlabel">미리보기</span>
      <button onclick="togglePreviewDark()" class="mini" id="prev-dark-btn">배경 전환</button>
      <button onclick="duplicateSel()" class="icon" title="복제" id="dup-btn"><svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
      <button onclick="moveSel(-1)" class="icon" title="위로"><svg class="ic" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      <button onclick="moveSel(1)" class="icon" title="아래로"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button>
      <button onclick="deleteSel()" class="icon danger" title="삭제"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
      <button onclick="clearAll()" class="icon danger" title="전체 삭제"><svg class="ic" viewBox="0 0 24 24"><path d="M3 3l18 18M3 21L21 3"/></svg></button>
    </div>
    <div class="canvas-outer">
      <div class="canvas-root" id="canvas" onclick="bgClick(event)"></div>
    </div>
  </div>

  <div class="panel right" id="panel-right">
    <div class="panel-scroll">
      <div id="props">
        <div class="no-sel"><svg class="ic" viewBox="0 0 24 24" style="width:24px;height:24px"><path d="M9 4v16M15 4v16M4 9h5M4 15h5M15 9h5M15 15h5"/></svg><span>요소를 선택하면<br>서식 옵션이 나타납니다</span></div>
      </div>
      <div id="output-block" style="border-top:0.5px solid var(--border);padding:12px">
        <div class="sec-title">HTML 출력</div>
        <textarea class="out" id="html-out" readonly placeholder="요소를 추가하면 코드가 생성됩니다"></textarea>
        <div style="display:flex;gap:5px;margin-top:5px">
          <button onclick="copyHTML()" style="flex:1"><svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg> 복사</button>
          <button onclick="exportHTML()" style="flex:1"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg> HTML</button>
        </div>
        <div style="display:flex;gap:5px;margin-top:5px">
          <button onclick="exportJSON()" class="mini" style="flex:1">작업 저장</button>
          <button onclick="importJSON()" class="mini" style="flex:1">불러오기</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const LS_KEY='deco-editor-v2',LS_DARK='deco-dark-v2',LS_RECENT='deco-recent-v2';
let tree=[],sel=null,idc=0,drag=null,activeTab='style';
let recent=['#378ADD','#0F6E56','#D85A30','#7F77DD','#D4537E','#222222'];
let undoStack=[];
let redoStack=[];
let fmtClip=null;
const CONTAINERS=['box','quote','details','row'];

const SVG={
  box:'<rect x="3" y="3" width="18" height="18" rx="2"/>',
  row:'<rect x="3" y="4" width="7" height="16" rx="1"/><rect x="14" y="4" width="7" height="16" rx="1"/>',
  text:'<path d="M4 7V5h16v2M9 19h6M12 5v14"/>',
  heading:'<path d="M6 4v16M18 4v16M6 12h12"/>',
  badge:'<path d="M20.6 13.4L11 3.8a2 2 0 0 0-1.4-.6H4v5.6a2 2 0 0 0 .6 1.4l9.6 9.6a2 2 0 0 0 2.8 0l3.6-3.6a2 2 0 0 0 0-2.8z"/><circle cx="7.5" cy="7.5" r="1"/>',
  quote:'<path d="M6 17h3l2-4V7H5v6h3zM14 17h3l2-4V7h-6v6h3z"/>',
  divider:'<path d="M5 12h14"/>',
  details:'<path d="M9 6l6 6-6 6"/>',
  img:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
};
function icon(t){return `<svg class="ic" viewBox="0 0 24 24">${SVG[t]}</svg>`;}

function DEFNODE(type){
  const base={box:{tag:'div',text:'',fs:14,fw:400,ta:'left'},row:{tag:'div',text:'',fs:14,fw:400,ta:'left'},text:{tag:'p',text:'텍스트 내용을 입력하세요',fs:15,fw:400,ta:'left'},heading:{tag:'h2',text:'제목',fs:22,fw:500,ta:'left'},badge:{tag:'span',text:'뱃지',fs:12,fw:500,ta:'center'},quote:{tag:'blockquote',text:'인용구 내용',fs:14,fw:400,ta:'left'},divider:{tag:'hr',text:'',fs:14,fw:400,ta:'left'},details:{tag:'details',text:'클릭해서 펼치기',fs:14,fw:400,ta:'left'},img:{tag:'img',text:'',fs:14,fw:400,ta:'left'}}[type];
  const fills={box:'#e8f4fd',row:'off',text:'off',heading:'off',badge:'#0F6E56',quote:'#f5f0ff',divider:'#aaaaaa',details:'#f9f9f9',img:'off'};
  const colors={box:'#0c447c',badge:'#ffffff',quote:'#3C3489',text:'#222222',heading:'#111111',details:'#222222',row:'#222222',divider:'off',img:'off'};
  const borders={box:'#378ADD',badge:'#0F6E56',quote:'#7F77DD',details:'#cccccc',img:'#cccccc',row:'off',text:'off',heading:'off',divider:'off'};
  const bw={box:2,badge:1,quote:3,details:1,img:1,row:0,text:0,heading:0,divider:0}[type];
  return {tag:base.tag,text:base.text,fs:base.fs,fw:base.fw,ta:base.ta,
    fillType:'solid',fill:fills[type]==='off'?{on:false,val:'#ffffff'}:{on:true,val:fills[type]},
    gradFrom:'#7F77DD',gradTo:'#378ADD',gradAngle:135,
    color:colors[type]==='off'?{on:false,val:'#222222'}:{on:true,val:colors[type]},
    txtGrad:false,txtGradFrom:'#D85A30',txtGradTo:'#7F77DD',txtGradAngle:90,
    txtShadow:0,txtShadowColor:'#000000',txtShadowAlpha:35,txtShadowX:1,txtShadowY:1,
    border:borders[type]==='off'?{on:false,val:'#cccccc'}:{on:true,val:borders[type]},
    bw:bw,bstyle:'solid',sides:{t:true,r:true,b:true,l:true},
    br:type==='badge'?20:(type==='box'||type==='details'?8:(type==='quote'?4:(type==='divider'?2:(type==='img'?6:0)))),
    brMode:'all',brTL:8,brTR:8,brBR:8,brBL:8,opacity:100,
    pad:(type==='text'||type==='heading')?4:(type==='badge'?8:(type==='divider'||type==='img'?0:16)),
    padMode:'all',padT:0,padR:0,padB:0,padL:0,
    mg:0,mgMode:'all',mgT:0,mgR:0,mgB:0,mgL:0,
    va:'top',
    lh:1.6,ls:0,font:'',
    shadow:0,shadowColor:'#000000',shadowAlpha:25,shadowX:0,shadowY:4,shadowSpread:0,
    dir:'column',gap:CONTAINERS.includes(type)?(type==='row'?10:8):0,
    w:type==='img'?200:0,h:type==='img'?140:0,imgSrc:type==='img'?'https://placecats.com/200/140':''};
}
const LABELS={box:'박스',row:'가로줄',text:'텍스트',heading:'제목',badge:'뱃지',quote:'인용구',divider:'구분선',details:'접기/펼치기',img:'이미지'};
const BSTYLES=[['solid','실선'],['dashed','대시'],['dotted','점선'],['double','겹선'],['groove','홈']];
const FONT_OPTIONS=[['','기본'],['noto','노토 산스'],['malgun','맑은 고딕'],['nanum-gothic','나눔고딕'],['nanum-myeongjo','나눔명조'],['ridi-batang','리디바탕'],['gangwon-edu','강원교육모두체'],['ongleub-parkdahyun','온글잎박다현체'],['dotum','돋움'],['gulim','굴림'],['batang','바탕'],['gungsuh','궁서'],['arial','Arial'],['times','Times New Roman'],['georgia','Georgia'],['courier','Courier New']];
const FONT_FAMILY={'noto':"'Noto Sans KR',sans-serif",'malgun':"'Malgun Gothic','맑은 고딕',sans-serif",'nanum-gothic':"'Nanum Gothic',sans-serif",'nanum-myeongjo':"'Nanum Myeongjo',serif",'ridi-batang':"'Ridibatang',serif",'gangwon-edu':"'GangwonEduModu',sans-serif",'ongleub-parkdahyun':"'OngleipParkDahyeon',sans-serif",'dotum':"'Dotum','돋움',sans-serif",'gulim':"'Gulim','굴림',sans-serif",'batang':"'Batang','바탕',serif",'gungsuh':"'Gungsuh','궁서',serif",'arial':"Arial,sans-serif",'times':"'Times New Roman',serif",'georgia':"Georgia,serif",'courier':"'Courier New',monospace"};
const THEMES=[{name:'블루',fill:'#e8f4fd',color:'#0c447c',border:'#378ADD'},{name:'민트',fill:'#E1F5EE',color:'#085041',border:'#1D9E75'},{name:'코랄',fill:'#FAECE7',color:'#712B13',border:'#D85A30'},{name:'퍼플',fill:'#EEEDFE',color:'#3C3489',border:'#7F77DD'},{name:'핑크',fill:'#FBEAF0',color:'#72243E',border:'#D4537E'},{name:'그레이',fill:'#F1EFE8',color:'#2C2C2A',border:'#888780'},{name:'앰버',fill:'#FAEEDA',color:'#633806',border:'#EF9F27'},{name:'없음',fill:'off',color:'#222222',border:'off'}];

const ADD_TYPES=['box','row','text','heading','badge','quote','divider','details','img'];
document.getElementById('add-buttons').innerHTML=ADD_TYPES.map(t=>`<button class="${t==='row'?'accent':''}" onclick="addEl('${t}')">${icon(t)} ${LABELS[t]}</button>`).join('');

function findNode(id,list){list=list||tree;for(const n of list){if(n.id===id)return n;if(n.children){const r=findNode(id,n.children);if(r)return r;}}return null;}
function findParent(id,list,parent){list=list||tree;parent=parent||null;for(const n of list){if(n.id===id)return parent;if(n.children){const r=findParent(id,n.children,n);if(r)return r;}}return null;}
function getSiblings(id){const p=findParent(id);return p?p.children:tree;}
function mkNode(type,over){over=over||{};const id=++idc;const n=Object.assign({id:id,type:type},DEFNODE(type),over);if(CONTAINERS.includes(type))n.children=over.children||[];return n;}
function addEl(type){pushUndo();const node=mkNode(type);const selNode=sel?findNode(sel):null;if(selNode&&selNode.children)selNode.children.push(node);else tree.push(node);sel=node.id;renderAll();}
function addRecent(c){if(!c||c==='off')return;recent=recent.filter(x=>x.toLowerCase()!==c.toLowerCase());recent.unshift(c);recent=recent.slice(0,6);try{localStorage.setItem(LS_RECENT,JSON.stringify(recent));}catch(e){}}

function snapshot(){return JSON.stringify({tree:tree,idc:idc});}
function pushUndo(){undoStack.push(snapshot());if(undoStack.length>80)undoStack.shift();redoStack=[];updateUndoBtns();}
function undo(){if(!undoStack.length)return;redoStack.push(snapshot());const s=JSON.parse(undoStack.pop());tree=s.tree;idc=s.idc;sel=null;updateUndoBtns();renderAll();}
function redo(){if(!redoStack.length)return;undoStack.push(snapshot());const s=JSON.parse(redoStack.pop());tree=s.tree;idc=s.idc;sel=null;updateUndoBtns();renderAll();}
function updateUndoBtns(){const u=document.getElementById('undo-btn');if(u)u.disabled=!undoStack.length;const r=document.getElementById('redo-btn');if(r)r.disabled=!redoStack.length;}

function renderAll(){renderCanvas();renderTree();renderProps();updateOutput();saveState();updateButtons();}
function updateButtons(){document.getElementById('dup-btn').disabled=!sel;}

function rgba(hex,a){const h=hex.replace('#','');const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return'rgba('+r+','+g+','+b+','+(a/100).toFixed(2)+')';}
function fillCSS(node){if(node.fillType==='gradient')return'linear-gradient('+node.gradAngle+'deg, '+node.gradFrom+', '+node.gradTo+')';return node.fill.on?node.fill.val:'';}
function borderCSS(node,forQuote){if(!node.border.on||node.bw===0)return'';const c=node.border.val,w=node.bw,st=node.bstyle;if(forQuote)return'border-left:'+w+'px '+st+' '+c+';';const all=node.sides.t&&node.sides.r&&node.sides.b&&node.sides.l;if(all)return'border:'+w+'px '+st+' '+c+';';let s='';if(node.sides.t)s+='border-top:'+w+'px '+st+' '+c+';';if(node.sides.r)s+='border-right:'+w+'px '+st+' '+c+';';if(node.sides.b)s+='border-bottom:'+w+'px '+st+' '+c+';';if(node.sides.l)s+='border-left:'+w+'px '+st+' '+c+';';return s;}
function shadowCSS(node){if(node.shadow===0&&node.shadowSpread===0)return'';return'box-shadow:'+node.shadowX+'px '+node.shadowY+'px '+node.shadow+'px '+node.shadowSpread+'px '+rgba(node.shadowColor,node.shadowAlpha)+';';}
function txtShadowCSS(node){if(!node.txtShadow)return'';return'text-shadow:'+node.txtShadowX+'px '+node.txtShadowY+'px '+node.txtShadow+'px '+rgba(node.txtShadowColor,node.txtShadowAlpha)+';';}
function txtGradCSS(node){if(!node.txtGrad)return'';return'background:linear-gradient('+node.txtGradAngle+'deg, '+node.txtGradFrom+', '+node.txtGradTo+');-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;';}
function vaMap(v){return v==='center'?'center':(v==='bottom'?'flex-end':'flex-start');}
function vaJustify(ta){return ta==='center'?'center':(ta==='right'?'flex-end':'flex-start');}
function textCSS(node){let s='font-size:'+node.fs+'px;font-weight:'+node.fw+';text-align:'+node.ta+';';if(node.font&&FONT_FAMILY[node.font])s+='font-family:'+FONT_FAMILY[node.font]+';';if(node.lh!==1.6)s+='line-height:'+node.lh+';';if(node.ls)s+='letter-spacing:'+node.ls+'px;';if(node.va&&node.va!=='top'){s+='display:flex;flex-direction:column;justify-content:'+vaMap(node.va)+';';}return s;}
function radiusCSS(node){if(node.brMode==='each')return'border-radius:'+node.brTL+'px '+node.brTR+'px '+node.brBR+'px '+node.brBL+'px;';return'border-radius:'+node.br+'px;';}
function opacityCSS(node){return (node.opacity!==undefined&&node.opacity<100)?'opacity:'+(node.opacity/100).toFixed(2)+';':'';}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function padCSS(node){if(node.padMode==='each')return'padding:'+node.padT+'px '+node.padR+'px '+node.padB+'px '+node.padL+'px;';return'padding:'+node.pad+'px;';}
function mgCSS(node){if(node.mgMode==='each')return'margin:'+node.mgT+'px '+node.mgR+'px '+node.mgB+'px '+node.mgL+'px;';return node.mg?'margin:'+node.mg+'px;':'';}

function innerStyle(node){
  let s='';const f=fillCSS(node);
  if(node.type==='row'){if(f)s+='background:'+f+';';}
  else if(node.txtGrad){if(f)s+='background:'+f+';';}
  else if(f)s+='background:'+f+';';
  s+=borderCSS(node,node.type==='quote');s+=radiusCSS(node);s+=padCSS(node);s+=mgCSS(node);s+=shadowCSS(node);s+=opacityCSS(node);
  if(node.type!=='row'){
    if(node.txtGrad)s+=txtGradCSS(node);
    else if(node.color.on)s+='color:'+node.color.val+';';
    s+=textCSS(node);s+=txtShadowCSS(node);
  }
  return s;
}

function nodeToDOM(node){
  const wrap=document.createElement('div');
  wrap.className='rwrap'+(sel===node.id?' sel-outline':'');
  if(node.w&&node.type!=='divider')wrap.style.width=node.w+'px';
  let elem;
  if(node.type==='img'){
    elem=document.createElement('img');elem.className='rbox';elem.src=node.imgSrc||'https://placecats.com/200/140';
    elem.style.cssText='width:'+(node.w||200)+'px;'+(node.h?'height:'+node.h+'px;':'')+'object-fit:cover;'+borderCSS(node)+radiusCSS(node)+shadowCSS(node)+opacityCSS(node)+'display:block';elem.alt='';
  } else if(node.type==='divider'){
    elem=document.createElement('hr');elem.className='rbox';const c=node.fill.on?node.fill.val:'#aaaaaa';
    elem.style.cssText='width:'+(node.w?node.w+'px':'100%')+';height:4px;background:'+(node.fillType==='gradient'?fillCSS(node):c)+';border:none;'+radiusCSS(node)+opacityCSS(node);
  } else {
    elem=document.createElement('div');elem.className='rbox';
    let s=innerStyle(node);
    if(node.w)s+='width:100%;';else if(node.type==='badge')s+='display:inline-block;';
    if(node.h)s+='min-height:'+node.h+'px;';
    if(node.type==='row'&&node.children.length===0)s+='min-height:40px;outline:1px dashed #bbb;';
    if(node.type==='details'){const head=document.createElement('div');head.style.cssText='font-weight:500;cursor:pointer';head.innerHTML='▶ '+esc(node.text);elem.appendChild(head);}
    else if(CONTAINERS.includes(node.type)){if(node.text){const lbl=document.createElement('div');lbl.innerHTML=esc(node.text);lbl.style.marginBottom='4px';elem.appendChild(lbl);}}
    else elem.innerHTML=esc(node.text);
    elem.style.cssText+=s;
    if(node.children){const cw=document.createElement('div');cw.style.cssText='display:flex;flex-direction:'+(node.dir==='row'?'row':'column')+';gap:'+node.gap+'px;'+(node.dir==='row'?'flex-wrap:wrap;align-items:stretch':'');node.children.forEach(function(c){cw.appendChild(nodeToDOM(c));});elem.appendChild(cw);}
  }
  elem.style.cursor='pointer';
  elem.addEventListener('click',function(e){e.stopPropagation();sel=node.id;renderAll();});
  elem.addEventListener('dblclick',function(e){
    e.stopPropagation();
    if(node.type==='img'){const v=prompt('이미지 URL:',node.imgSrc);if(v!==null){pushUndo();node.imgSrc=v;renderAll();}return;}
    if(node.type==='divider'||node.type==='row')return;
    const v=prompt('내용 편집:',node.text);if(v!==null){pushUndo();node.text=v;renderAll();}
  });
  wrap.appendChild(elem);
  if(sel===node.id&&node.type!=='divider'){
    const hw=document.createElement('div');hw.className='rhandle';hw.addEventListener('mousedown',function(e){e.stopPropagation();e.preventDefault();pushUndo();drag={id:node.id,axis:'w',sx:e.clientX,sw:node.w||elem.offsetWidth};});wrap.appendChild(hw);
    const hh=document.createElement('div');hh.className='rhandle-h';hh.addEventListener('mousedown',function(e){e.stopPropagation();e.preventDefault();pushUndo();drag={id:node.id,axis:'h',sy:e.clientY,sh:node.h||elem.offsetHeight};});wrap.appendChild(hh);
  }
  return wrap;
}

document.addEventListener('mousemove',function(e){if(!drag)return;const n=findNode(drag.id);if(!n)return;if(drag.axis==='w')n.w=Math.max(40,Math.round(drag.sw+(e.clientX-drag.sx)));else n.h=Math.max(20,Math.round(drag.sh+(e.clientY-drag.sy)));renderCanvas();renderProps();updateOutput();});
document.addEventListener('mouseup',function(){if(drag){drag=null;saveState();}});

function renderCanvas(){const cv=document.getElementById('canvas');cv.innerHTML='';if(tree.length===0){cv.innerHTML='<div class="no-sel" style="padding:48px 0">왼쪽에서 요소·템플릿을 추가하세요</div>';return;}const wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-direction:column;gap:10px';tree.forEach(function(n){wrap.appendChild(nodeToDOM(n));});cv.appendChild(wrap);}
function renderTree(){const t=document.getElementById('tree');t.innerHTML='';if(tree.length===0){t.innerHTML='<div class="hint" style="margin:0">아직 요소가 없습니다.</div>';return;}function walk(list,depth){list.forEach(function(n){const div=document.createElement('div');div.className='tree-node'+(sel===n.id?' sel':'');div.style.marginLeft=(depth*12)+'px';div.innerHTML=icon(n.type)+' '+LABELS[n.type]+(n.children?' ('+n.children.length+')':'');div.onclick=function(){sel=n.id;renderAll();};t.appendChild(div);if(n.children)walk(n.children,depth+1);});}walk(tree,0);}

function numRow(label,id,key,min,max,step){const n=findNode(id);const v=n[key];return '<div class="row"><span class="lab">'+label+'</span><input type="range" min="'+min+'" max="'+max+'" step="'+(step||1)+'" value="'+v+'" oninput="setP('+id+',\''+key+'\',parseFloat(this.value),true);document.getElementById(\'n_'+key+'_'+id+'\').value=this.value"><input type="text" class="num" id="n_'+key+'_'+id+'" value="'+v+'" onchange="setNum('+id+',\''+key+'\',this.value)"></div>';}
function setNum(id,key,val){const v=parseFloat(val);if(isNaN(v))return;pushUndo();setP(id,key,v,true);renderProps();}

function colorRow(label,id,prop){const n=findNode(id);const c=n[prop];const sw=c.on?'background:'+c.val:'background:repeating-conic-gradient(#bbb 0% 25%, #fff 0% 50%) 0/10px 10px';return '<div class="row"><span class="lab">'+label+'</span><button class="color-trigger" style="'+sw+'" onclick="openColorPop(this,'+id+',\''+prop+'\',true)" title="색 선택"></button><input type="text" class="hex" value="'+c.val+'" '+(c.on?'':'disabled')+' onchange="setColor('+id+',\''+prop+'\',this.value)"><button class="mini '+(c.on?'on':'')+'" onclick="toggleColor('+id+',\''+prop+'\')" style="margin-left:auto">'+(c.on?'사용':'없음')+'</button></div>';}
function plainColorRow(label,id,key){const n=findNode(id);return '<div class="row"><span class="lab">'+label+'</span><button class="color-trigger" style="background:'+n[key]+'" onclick="openColorPop(this,'+id+',\''+key+'\',false)" title="색 선택"></button><input type="text" class="hex" value="'+n[key]+'" onchange="setPlainColor('+id+',\''+key+'\',this.value)"></div>';}
function recentRow(){return '';}
function toggleColor(id,prop){pushUndo();const n=findNode(id);n[prop].on=!n[prop].on;renderCanvas();renderProps();updateOutput();saveState();}
function setColor(id,prop,v){if(!/^#[0-9a-fA-F]{6}$/.test(v)){renderProps();return;}pushUndo();const n=findNode(id);n[prop].val=v;n[prop].on=true;addRecent(v);renderCanvas();renderProps();updateOutput();saveState();}
function setPlainColor(id,key,v){if(!/^#[0-9a-fA-F]{6}$/.test(v)){renderProps();return;}pushUndo();const n=findNode(id);n[key]=v;addRecent(v);renderCanvas();renderProps();updateOutput();saveState();}

const PALETTE=['#FFFFFF','#F1EFE8','#D3D1C7','#888780','#5F5E5A','#2C2C2A','#1c1c1a','#000000','#E6F1FB','#85B7EB','#378ADD','#185FA5','#0C447C','#E1F5EE','#1D9E75','#0F6E56','#FAECE7','#F0997B','#D85A30','#993C1D','#712B13','#FBEAF0','#D4537E','#72243E','#EEEDFE','#AFA9EC','#7F77DD','#534AB7','#3C3489','#FAEEDA','#EF9F27','#854F0B'];
function closeColorPop(){const p=document.getElementById('color-pop');if(p)p.remove();const b=document.getElementById('pop-backdrop');if(b)b.remove();}
function openColorPop(btn,id,prop,hasOn){
  closeColorPop();
  const bd=document.createElement('div');bd.className='pop-backdrop';bd.id='pop-backdrop';bd.onclick=closeColorPop;document.body.appendChild(bd);
  const pop=document.createElement('div');pop.className='color-pop';pop.id='color-pop';
  const apply='__pick_'+(hasOn?'on':'plain');
  let html='<div class="pop-title">추천 색상</div><div class="sw-grid">';
  html+=PALETTE.map(function(c){return '<button class="sw" style="background:'+c+'" title="'+c+'" data-c="'+c+'"></button>';}).join('');
  html+='</div>';
  if(recent.length){html+='<div class="pop-title">최근 사용한 색</div><div class="sw-grid">'+recent.map(function(c){return '<button class="sw" style="background:'+c+'" title="'+c+'" data-c="'+c+'"></button>';}).join('')+'</div>';}
  html+='<div class="pop-custom"><span style="font-size:11px;color:var(--text-2)">직접 선택</span><input type="color" value="'+(findNode(id)[prop].val||findNode(id)[prop]||'#888888')+'" id="pop-custom-input"><span style="font-size:10px;color:var(--text-3)">클릭→색상환</span></div>';
  pop.innerHTML=html;
  document.body.appendChild(pop);
  const rect=btn.getBoundingClientRect();
  let top=rect.bottom+4,left=rect.left;
  const pw=202,ph=pop.offsetHeight;
  if(left+pw>window.innerWidth-8)left=window.innerWidth-pw-8;
  if(top+ph>window.innerHeight-8)top=rect.top-ph-4;
  if(top<8)top=8;
  pop.style.left=left+'px';pop.style.top=top+'px';
  pop.querySelectorAll('.sw').forEach(function(s){s.onclick=function(){pick(id,prop,s.dataset.c,hasOn);closeColorPop();};});
  pop.querySelector('#pop-custom-input').oninput=function(){pick(id,prop,this.value,hasOn);};
  pop.querySelector('#pop-custom-input').onchange=function(){closeColorPop();};
}
function pick(id,prop,v,hasOn){if(hasOn)setColor(id,prop,v);else setPlainColor(id,prop,v);}
function applyTheme(id,t){pushUndo();const n=findNode(id);n.fillType='solid';n.txtGrad=false;n.fill=t.fill==='off'?{on:false,val:'#ffffff'}:{on:true,val:t.fill};n.color={on:true,val:t.color};n.border=t.border==='off'?{on:false,val:'#cccccc'}:{on:true,val:t.border};if(t.border!=='off'&&n.bw===0)n.bw=2;renderCanvas();renderProps();updateOutput();saveState();}

function tabBtn(key,label,svg){return '<div class="tab '+(activeTab===key?'active':'')+'" onclick="switchTab(\''+key+'\')">'+svg+' '+label+'</div>';}
function switchTab(k){activeTab=k;renderProps();}

function renderProps(){
  const p=document.getElementById('props');const n=sel?findNode(sel):null;
  if(!n){p.innerHTML='<div class="no-sel"><svg class="ic" viewBox="0 0 24 24" style="width:24px;height:24px"><path d="M9 4v16M15 4v16M4 9h5M4 15h5M15 9h5M15 15h5"/></svg><span>요소를 선택하면<br>서식 옵션이 나타납니다</span></div>';return;}
  const isImg=n.type==='img',isDiv=n.type==='divider',isRow=n.type==='row',isCont=!!n.children,isQuote=n.type==='quote';
  const hasText=!isImg&&!isDiv&&!isRow;
  if(!hasText&&activeTab==='text')activeTab='style';

  let h='<div class="sel-header"><span class="name">'+icon(n.type)+' '+LABELS[n.type]+'</span><span style="display:flex;gap:4px"><button class="mini" onclick="copyFormat()" title="서식 복사 (Ctrl+Shift+C)"><svg class="ic" viewBox="0 0 24 24"><path d="M9 3h10a2 2 0 0 1 2 2v10"/><rect x="3" y="9" width="12" height="12" rx="2"/></svg></button><button class="mini" onclick="pasteFormat()" title="서식 붙여넣기 (Ctrl+Shift+V)"'+(fmtClip?'':' disabled')+'><svg class="ic" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 13l2 2 4-4"/></svg></button><button class="mini" onclick="duplicateSel()" title="복제"><svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button><button class="mini danger" onclick="deleteSel()" title="삭제"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button></span></div>';

  h+='<div class="core-block">';
  if(hasText)h+='<div class="row"><span class="lab">내용</span><textarea rows="2" oninput="setP('+n.id+',\'text\',this.value)" style="resize:vertical">'+esc(n.text)+'</textarea></div>';
  if(isImg)h+='<div class="row"><span class="lab">URL</span><input type="text" value="'+esc(n.imgSrc)+'" oninput="setP('+n.id+',\'imgSrc\',this.value)"></div>';
  if(!isImg&&!isDiv){h+='<div class="sec-title" style="margin-bottom:6px">색상 테마</div><div class="theme-grid">'+THEMES.map(function(t){return '<div class="theme-cell" onclick=\'applyTheme('+n.id+','+JSON.stringify(t)+')\'><div class="theme-dots"><span class="theme-dot" style="background:'+(t.fill==='off'?'transparent':t.fill)+';'+(t.fill==='off'?'border-style:dashed':'')+'"></span><span class="theme-dot" style="background:'+(t.border==='off'?'transparent':t.border)+';'+(t.border==='off'?'border-style:dashed':'')+'"></span></div><span>'+t.name+'</span></div>';}).join('')+'</div>';}
  h+='</div>';

  const styleTabIc='<svg class="ic" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 22a10 10 0 1 1 0-20c2 0 3 1 3 2.5S17 7 19 7a3 3 0 0 1 0 6c-1 0-2 1-2 2s1 2 1 3a3 3 0 0 1-6 4z"/></svg>';
  const textTabIc='<svg class="ic" viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></svg>';
  h+='<div class="tabs">'+tabBtn('style','스타일',styleTabIc);
  if(hasText)h+=tabBtn('text','텍스트',textTabIc);
  h+='</div>';

function toggleSide(id,s){pushUndo();const n=findNode(id);n.sides[s]=!n.sides[s];renderCanvas();renderProps();updateOutput();saveState();}

function toggleAllSides(id){pushUndo();const n=findNode(id);const allOn=n.sides.t&&n.sides.r&&n.sides.b&&n.sides.l;const v=!allOn;n.sides={t:v,r:v,b:v,l:v};renderCanvas();renderProps();updateOutput();saveState();}
function setP(id,key,val,fromInput){if(!fromInput&&key!=='text'&&key!=='imgSrc')pushUndo();const n=findNode(id);if(n){n[key]=val;renderCanvas();renderTree();updateOutput();saveState();}}
function duplicateSel(){if(!sel)return;pushUndo();const sib=getSiblings(sel);const i=sib.findIndex(function(x){return x.id===sel;});const copy=JSON.parse(JSON.stringify(sib[i]));function reid(nd){nd.id=++idc;if(nd.children)nd.children.forEach(reid);}reid(copy);sib.splice(i+1,0,copy);sel=copy.id;renderAll();}
function deleteSel(){if(!sel)return;pushUndo();const sib=getSiblings(sel);const i=sib.findIndex(function(x){return x.id===sel;});if(i>=0)sib.splice(i,1);sel=null;renderAll();}
function clearAll(){if(tree.length&&!confirm('캔버스의 모든 요소를 삭제할까요? (실행취소로 되돌릴 수 있어요)'))return;pushUndo();tree=[];sel=null;renderAll();}
function resetAll(){if(!confirm('현재 작업 내용을 모두 비우고 처음부터 시작할까요?'))return;pushUndo();tree=[];sel=null;idc=0;try{localStorage.removeItem(LS_KEY);}catch(e){}renderAll();toast('초기화되었습니다');}
function moveSel(d){if(!sel)return;const sib=getSiblings(sel);const i=sib.findIndex(function(x){return x.id===sel;});const j=i+d;if(j<0||j>=sib.length)return;pushUndo();const tmp=sib[i];sib[i]=sib[j];sib[j]=tmp;renderAll();}

function indent(d){let s='';for(let i=0;i<d;i++)s+='  ';return s;}
function nodeToHTML(node,d){
  const pad=indent(d);
  if(node.type==='img')return pad+'<img src="'+node.imgSrc+'" style="width:'+(node.w||200)+'px;'+(node.h?'height:'+node.h+'px;':'')+'object-fit:cover;'+borderCSS(node)+radiusCSS(node)+shadowCSS(node)+opacityCSS(node)+'display:block" alt="">';
  if(node.type==='divider'){const c=node.fillType==='gradient'?fillCSS(node):(node.fill.on?node.fill.val:'#aaaaaa');return pad+'<hr style="width:'+(node.w?node.w+'px':'100%')+';height:4px;background:'+c+';border:none;'+radiusCSS(node)+opacityCSS(node)+'">';}
  let s=innerStyle(node);
  if(node.w)s+='width:'+node.w+'px;';if(node.h)s+='min-height:'+node.h+'px;';if(node.type==='badge')s+='display:inline-block;';
  const flexStyle=node.children?'display:flex;flex-direction:'+node.dir+';gap:'+node.gap+'px;'+(node.dir==='row'?'flex-wrap:wrap;align-items:stretch;':''):'';
  if(node.type==='details'){let inner=indent(d+1)+'<summary style="font-weight:500;cursor:pointer">'+esc(node.text)+'</summary>';if(node.children&&node.children.length)inner+='\n'+indent(d+1)+'<div style="'+flexStyle+'">'+'\n'+node.children.map(function(c){return nodeToHTML(c,d+2);}).join('\n')+'\n'+indent(d+1)+'</div>';return pad+'<details style="'+s+'">\n'+inner+'\n'+pad+'</details>';}
  if(node.type==='row'){if(!node.children.length)return pad+'<div style="'+s+flexStyle+'"></div>';return pad+'<div style="'+s+flexStyle+'">\n'+node.children.map(function(c){return nodeToHTML(c,d+1);}).join('\n')+'\n'+pad+'</div>';}
  if(node.children){let inner='';if(node.text)inner+=indent(d+1)+'<div style="margin-bottom:4px">'+esc(node.text)+'</div>\n';if(node.children.length)inner+=indent(d+1)+'<div style="'+flexStyle+'">\n'+node.children.map(function(c){return nodeToHTML(c,d+2);}).join('\n')+'\n'+indent(d+1)+'</div>';else inner=inner.replace(/\n$/,'');return pad+'<'+node.tag+' style="'+s+'">\n'+inner+'\n'+pad+'</'+node.tag+'>';}
  return pad+'<'+node.tag+' style="'+s+'">'+esc(node.text)+'</'+node.tag+'>';
}

function collectFonts(list,set){list.forEach(function(n){if(n.font&&WEBFONT_CSS[n.font])set.add(n.font);if(n.children)collectFonts(n.children,set);});return set;}

function importJSON(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=function(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=function(){try{const data=JSON.parse(r.result);if(data.tree){pushUndo();tree=data.tree;idc=data.idc||1000;migrate(tree);sel=null;renderAll();}}catch(err){alert('불러오기 실패: 올바른 프로젝트 파일이 아닙니다.');}};r.readAsText(file);};inp.click();}

function saveState(){}
function migrate(list){list.forEach(function(n){if(n.opacity===undefined)n.opacity=100;if(n.font===undefined)n.font='';if(n.brMode===undefined)n.brMode='all';if(n.brTL===undefined)n.brTL=n.br||0;if(n.brTR===undefined)n.brTR=n.br||0;if(n.brBR===undefined)n.brBR=n.br||0;if(n.brBL===undefined)n.brBL=n.br||0;if(n.padMode===undefined)n.padMode='all';if(n.padT===undefined){n.padT=n.pad||0;n.padR=n.pad||0;n.padB=n.pad||0;n.padL=n.pad||0;}if(n.mg===undefined)n.mg=0;if(n.mgMode===undefined)n.mgMode='all';if(n.mgT===undefined){n.mgT=0;n.mgR=0;n.mgB=0;n.mgL=0;}if(n.va===undefined)n.va='top';if(n.children)migrate(n.children);});}
function loadState(){try{const r=localStorage.getItem(LS_RECENT);if(r)recent=JSON.parse(r);}catch(e){}try{localStorage.removeItem(LS_KEY);}catch(e){}}

const SUN='<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg> 라이트';
const MOON='<svg class="ic" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg> 다크';
function toggleDark(){const on=document.documentElement.classList.toggle('dark');document.getElementById('dark-btn').innerHTML=on?SUN:MOON;try{localStorage.setItem(LS_DARK,on?'1':'0');}catch(e){}}
function togglePreviewDark(){document.getElementById('canvas').classList.toggle('dark-preview');}

function mobileTab(which){['left','center','right'].forEach(function(p){document.getElementById('panel-'+p).style.display=(p===which)?'flex':'none';const b=document.getElementById('mt-'+p);if(b)b.classList.toggle('on',p===which);});}
function initMobile(){if(window.innerWidth<=860)mobileTab('center');else['left','center','right'].forEach(function(p){document.getElementById('panel-'+p).style.display='';});}

document.addEventListener('keydown',function(e){
  const ctrl=e.ctrlKey||e.metaKey;
  const t=e.target,tag=t&&t.tagName;
  const typing=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable);
  if(ctrl&&e.shiftKey&&(e.key==='c'||e.key==='C')){e.preventDefault();copyFormat();return;}
  if(ctrl&&e.shiftKey&&(e.key==='v'||e.key==='V')){e.preventDefault();pasteFormat();return;}
  if(ctrl&&(e.key==='y'||e.key==='Y')){e.preventDefault();redo();return;}
  if(ctrl&&e.shiftKey&&(e.key==='z'||e.key==='Z')){e.preventDefault();redo();return;}
  if(ctrl&&!e.shiftKey&&(e.key==='z'||e.key==='Z')){e.preventDefault();undo();return;}
  if(ctrl&&(e.key==='d'||e.key==='D')){if(sel){e.preventDefault();duplicateSel();}return;}
  if(typing)return;
  if((e.key==='Delete'||e.key==='Backspace')&&sel){e.preventDefault();pushUndo();const sib=getSiblings(sel);const i=sib.findIndex(function(x){return x.id===sel;});if(i>=0)sib.splice(i,1);sel=null;renderAll();return;}
  if(e.key==='Escape'){sel=null;closeColorPop();renderAll();return;}
});

loadState();
if(localStorage.getItem(LS_DARK)==='1'){document.documentElement.classList.add('dark');document.getElementById('dark-btn').innerHTML=SUN;}
renderAll();
initMobile();
window.addEventListener('resize',function(){if(window.innerWidth>860)['left','center','right'].forEach(function(p){document.getElementById('panel-'+p).style.display='';});});
</script>
